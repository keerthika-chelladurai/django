<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student profiles</title>
    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding: 0;
        }
        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#667eea,#764ba2);
            min-height:100vh;
            padding:50px 20px;
        }
        .container{
            max-width:1100px;
            margin:auto;
        }
        .heading{
            text-align:center;
            color:white;
            margin-bottom :40px;
        }
        .heading h1{
            font-size:40px;
            margin-bottom:10px;
        }
        .heading p{
            font-size:18px;
        }
        .student-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }
        .student-card{
            background-color:white;
            border-radius:15px;
            padding:25px;
            text-align:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
            transition:transform 0.3s ease, box-shadow 0.3s ease;
        }
        .student-card:hover{
            transform:translateY(-8px);
            box-shadow:0 15px 30px rgba(0,0,0,0.3);
        }
        .profile-icon{
            width:80px;
            height:80px;
            margin:0 auto 20px;
            border-radius:50%;
            background-color:#667eea;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            font-weight:bold;
        }
        .student-card h2{
            color:#333;
            margin-bottom:15px;
        }
        .student-info{
            text-align:left;
            margin-top:15px;
        }
        .student-info p{
            margin:10px 0;
            color:#555;
            font-size:16px;
        }
        .label{
            font-weight:bold;
            color:#333;
        }
        .course{
            display:inline-block;
            margin-top:10px;
            padding:8px 15px;
            border-radius:20px;
            background-color:#667eea;
            color:white;
            font-size:14px;
        }
        .footer{
            text-align:center;
            color:white;
            margin-top:40px;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Student Profiles</h1>
            <p>Python Full Stack Training Center</p>
        </div>
        <div class="student-container">
            {% for student in students %}
            <div class="student-card">
                <div class="profile-icon">
                    {{student.name|first|upper}}
                </div>
                <h2>{{student.name}}</h2>
                <div class="student-info">
                    <p>
                       <span class="label">Age:</span>
                       {{student.age}}
                    </p>
                    <p>
                        <span class="label">City:</span>
                        {{student.city}}
                    </p>
                </div>
                <div class="course">
                    {{student.course}}
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="footer">
            <p>Total Students:{{students|length}}</p>
        </div>
    </div>
</body>
</html>
