<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#667eea,#764ba2);
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .result-card{
            width:450px;
            background-color:white;
            padding: 35px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }
        h1{
            text-align:center;
            color:#2e7d32;
            margin-bottom:25px;
        }
        .student-info{
            background-color:#f5f5f5;
            padding: 20px;
            border-radius:10px;
        }
        .student-info p{
            font-size:18px;
            color:#444;
            margin:15px 0;
        }
        .label{
            font-weight:bold;
            color:#333;
        }
        .back-button{
            display:block;
            text-align:center;
            margin-top:25px;
            padding:12px;
            background-color:#667eea;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }
        .back-button:hover{
            background-color:#5568d9;
        }
    </style>
</head>
<body>
    <div class="result-card">
        <h1>Registration Successfull</h1>
        <div class="student-info">
            <p>
                <span class="label">Name:</span>
                {{name}}
            </p>
            <p>
                <span class="label">Age:</span>
                {{age}}
            </p>
            <p>
                <span class="label">Course:</span>
                {{course}}
            </p>
            <p>
                <span class="label">City</span>
                {{city}}
            </p>
        </div>
        {% comment %} <a href="/studentformget/"class="back-button">
        Register Another Student
        </a>
        {% endcomment %}

        {% if form_type == "post" %}
        <a href="/studentform/"class="back-button">
        Register Another Student
        </a>
        {% elif form_type == "get" %}
        <a href="/studentformget/"class="back-button">
        Register Another Student
        </a>

        {% endif %}
       
    </div>
    
</body>
</html>
